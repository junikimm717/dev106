name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Every target published by binaries.yml must at least compile before merge,
  # so a Linux-only change can't silently break the macOS release.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o /dev/null .
          # The bootstrapper only ever runs inside a Linux container.
          if [ "$GOOS" = linux ]; then go build -trimpath -o /dev/null ./cmd/bootstrap; fi

  # The installer is piped into `sh`, which is dash on Debian/Ubuntu/WSL.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh for bashisms
        run: |
          sudo apt-get update && sudo apt-get install -y dash devscripts
          checkbashisms install.sh
          dash -n install.sh
