name: Build 6.181 images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: junikimm717
  IMAGE_BASE: dev106

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################################
      # mit_6181
      ########################################

      - name: Build and push mit_6181
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: mit_6181
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/dev106/mit_6181:latest
            ghcr.io/${{ env.OWNER }}/dev106/mit_6181:2026

      ########################################
      # nvim_6181
      ########################################

      - name: Build and push nvim_6181
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: nvim_6181
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/dev106/nvim_6181:latest
            ghcr.io/${{ env.OWNER }}/dev106/nvim_6181:2026
