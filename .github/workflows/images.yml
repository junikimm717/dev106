name: Build and Push Dev106 Images

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  OWNER: junikimm717
  IMAGE_BASE: dev106

jobs:
  binaries:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build pre-release binaries
        run: |
          mkdir -p dist
          for spec in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${spec%/*}
            arch=${spec#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" \
              -o "dist/dev106-${os}-${arch}" .
          done
          cd dist && sha256sum * > checksums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev106-binaries
          path: dist/

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          gh release create nightly \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Nightly" \
            --generate-notes \
            dist/*

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - version: "2.1.0"
            student_rev: "96b68493ee65c11fdc3ca2564eebdc725b4dfb86"
          - version: "4.0-rc1"
            student_rev: "cafb755e3c78e828672ad0c26149bfa9dead4bcb"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################################
      # mit_6106
      ########################################

      - name: Build and push mit_6106:${{ matrix.version }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: mit_6106
          push: true
          platforms: linux/amd64
          build-args: |
            STUDENT_REV=${{ matrix.student_rev }}
          tags: |
            ghcr.io/${{ env.OWNER }}/dev106/mit_6106:${{ matrix.version }}
            ${{ matrix.version == '4.0-rc1' && format('ghcr.io/{0}/dev106/mit_6106:latest', env.OWNER) || '' }}

      ########################################
      # nvim
      ########################################

      - name: Build and push nvim:${{ matrix.version }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: nvim
          push: true
          platforms: linux/amd64
          build-args: |
            STUDENT_REV=${{ matrix.student_rev }}
          tags: |
            ghcr.io/${{ env.OWNER }}/dev106/nvim:${{ matrix.version }}
            ${{ matrix.version == '4.0-rc1' && format('ghcr.io/{0}/dev106/nvim:latest', env.OWNER) || '' }}

  build-6181:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################################
      # mit_6181
      ########################################

      - name: Build and push mit_6181
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: mit_6181
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dev106/mit_6181:latest
            ghcr.io/${{ env.OWNER }}/dev106/mit_6181:2026

      ########################################
      # nvim_6181
      ########################################

      - name: Build and push nvim_6181
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: nvim_6181
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dev106/nvim_6181:latest
            ghcr.io/${{ env.OWNER }}/dev106/nvim_6181:2026
